overblog_graphql:
    security:
        query_max_complexity: 100
        query_max_depth: false # test depth limitation replacing false with ex: 1

    definitions:
        schema:
            main:
                query: Query
                mutation: Mutation
        mappings:
            types:
                - type: yaml
                  dir: '%kernel.project_dir%/config/graphql'
                  suffix: ~

    errors_handler:
        enabled: true
        rethrow_internal_exceptions: true
