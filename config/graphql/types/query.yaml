Query:
    type: object
    config:
        fields:
            dinosaurs:
                type: '[Dinosaur!]!'
                complexity: '@=1 + childrenComplexity'
                args: { search: { type: 'String' } }
                resolve:    |
                    @=query(
                        "dinosaurs",
                        args["search"]
                    )
            dinosaur:
                # access: "@=isAuthenticated()"
                type: 'Dinosaur!'
                complexity: '@=1 + childrenComplexity'
                args: { id: { type: 'ID!' } }
                resolve:    |
                    @=query(
                        "dinosaur",
                        args["id"]
                    )

