Dinosaur:
    type: object
    config:
        fields:
            id: { type: 'ID!'} #, access: "@=isAuthenticated()" }
            name: {
                type: 'String!',
                complexity: '@=2',
                deprecationReason: "Use displayName instead"
            }
            gender: { type: 'String!', access: "@=hasRole('ROLE_ADMIN')" }
            age: { type: 'Int!' }
            birthdate: { type: 'String' }
            eyesColor: { type: 'String!' }
            species: { type: 'Species!',
                       complexity: '@=5'  }
            displayName: {
                type: 'String!',
                complexity: '@=2'
            }
