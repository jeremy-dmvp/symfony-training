---
services:
  php: &php
    platform: linux/x86_64
    build: .
    environment:
      APP_SECRET: $ecretf0rd3v
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_VERSION: 8.0.27
      MYSQL_DATABASE: databasorus
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - .:/usr/src/app:rw
    restart: unless-stopped

  nginx:
    platform: linux/x86_64
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/src/app/public:ro
    restart: unless-stopped

  phpmyadmin:
    platform: linux/x86_64
    image: phpmyadmin
    environment:
      PMA_ARBITRARY: 1
    ports:
      - 8080:80
    restart: unless-stopped

  database:
    platform: linux/x86_64
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
      - db_data:/var/lib/mysql:rw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  consumer:
    <<: *php
    command: bin/console messenger:consume async --memory-limit=128M --time-limit=3600 --limit=10 -vv
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data: ~
